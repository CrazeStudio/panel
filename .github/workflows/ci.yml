name: CrazePanel checks

on:
  push:
    branches:
      - main
      - crazepanel-v2-rebuild
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install

      - name: Check Node.js syntax
        run: npm run check

      - name: Run automated tests
        run: npm test
