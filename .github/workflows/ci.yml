name: CrazePanel checks

on:
  push:
    branches:
      - main
      - crazepanel-v2-rebuild
      - 'release/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install

      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/crazepanel-audit.json || true
          node -e "const a=require('/tmp/crazepanel-audit.json'); console.log('Advisory totals:', JSON.stringify(a.metadata?.vulnerabilities)); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(name, item.severity, 'fix=' + JSON.stringify(item.fixAvailable), 'via=' + item.via.map(x => typeof x === 'string' ? x : x.title).join(' | '));"

      - name: Check Node.js syntax
        run: npm run check

      - name: Run automated tests
        run: npm test
      - name: Build Docker images
        run: |
          docker build -f panel/Dockerfile -t crazepanel-panel-ci .
          docker build -f agent/Dockerfile -t crazepanel-agent-ci .
          docker run --rm --entrypoint sh crazepanel-agent-ci -c 'command -v tar'

      - name: Validate installer shell syntax
        run: |
          bash -n scripts/install-panel.sh
          bash -n scripts/install-agent.sh
